services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: montage
      POSTGRES_PASSWORD: montage
      POSTGRES_DB: montage
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U montage"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

volumes:
  pgdata:
